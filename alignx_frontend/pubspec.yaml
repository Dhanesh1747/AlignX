name: alignx_frontend
description: "AlignX Smart Habit & Posture Tracker UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # REST API Client (Spring Boot Connection)
  http: ^1.1.2

  # UI Enhancements & Animations
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3
  lottie: ^2.7.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
