spring.application.name=alignx_backend
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alignx_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:alignx_user}
spring.datasource.password=${DB_PASSWORD:alignx_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
