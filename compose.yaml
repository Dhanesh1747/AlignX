services:
  mysql:
    image: mysql:8.4
    container_name: alignx-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alignx_db
      MYSQL_USER: alignx_user
      MYSQL_PASSWORD: alignx_dev_password
      MYSQL_ROOT_PASSWORD: alignx_root_password
    ports:
      - "3306:3306"
    volumes:
      - alignx_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  alignx_mysql_data:
